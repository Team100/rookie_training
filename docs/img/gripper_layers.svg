<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The gripper bot and the layers of code that control it</title>
  <defs>
    <marker id="arrow-cmd" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c05621"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a3"/>
    </marker>
    <marker id="arrow-bind" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
  </defs>

  <!-- background, so it reads on light and dark GitHub themes -->
  <rect x="0" y="0" width="1000" height="610" rx="18" fill="#ffffff"/>

  <!-- ============ LEFT: the real robot ============ -->
  <text x="215" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">The gripper bot</text>
  <text x="215" y="66" text-anchor="middle" font-size="13" fill="#5a6475">seen from above</text>

  <!-- 4 subsystem: dashed outline around the whole gripper -->
  <rect x="46" y="82" width="338" height="358" rx="26" fill="none" stroke="#6b46c1" stroke-width="2.5" stroke-dasharray="9 6"/>

  <!-- base plate -->
  <rect x="62" y="98" width="306" height="326" rx="18" fill="#eef1f5" stroke="#a7b0bd" stroke-width="2"/>
  <!-- bolt holes -->
  <circle cx="82" cy="118" r="4" fill="#c3cad4"/><circle cx="348" cy="118" r="4" fill="#c3cad4"/>
  <circle cx="82" cy="404" r="4" fill="#c3cad4"/><circle cx="348" cy="404" r="4" fill="#c3cad4"/>

  <!-- shafts motor -> gearbox -->
  <rect x="136" y="292" width="8" height="30" fill="#7b8797"/>
  <rect x="286" y="292" width="8" height="30" fill="#7b8797"/>

  <!-- 2 mechanism: gearboxes -->
  <rect x="114" y="254" width="52" height="42" rx="6" fill="#b7791f"/>
  <rect x="264" y="254" width="52" height="42" rx="6" fill="#b7791f"/>
  <text x="140" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">gears</text>
  <text x="290" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">gears</text>

  <!-- 1 motors -->
  <circle cx="140" cy="352" r="33" fill="#2d3748"/>
  <circle cx="140" cy="352" r="22" fill="none" stroke="#4a5568" stroke-width="3"/>
  <text x="140" y="357" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">motor</text>
  <circle cx="290" cy="352" r="33" fill="#2d3748"/>
  <circle cx="290" cy="352" r="22" fill="none" stroke="#4a5568" stroke-width="3"/>
  <text x="290" y="357" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">motor</text>

  <!-- jaws (servo moves each one) -->
  <path d="M140,254 C140,196 160,158 192,140" fill="none" stroke="#2f855a" stroke-width="15" stroke-linecap="round"/>
  <path d="M290,254 C290,196 270,158 238,140" fill="none" stroke="#2f855a" stroke-width="15" stroke-linecap="round"/>
  <!-- open position ghosts -->
  <path d="M140,254 C132,200 118,165 96,142" fill="none" stroke="#2f855a" stroke-opacity="0.22" stroke-width="15" stroke-linecap="round"/>
  <path d="M290,254 C298,200 312,165 334,142" fill="none" stroke="#2f855a" stroke-opacity="0.22" stroke-width="15" stroke-linecap="round"/>
  <text x="96" y="128" text-anchor="middle" font-size="11" fill="#5a6475">OPEN</text>
  <text x="334" y="128" text-anchor="middle" font-size="11" fill="#5a6475">OPEN</text>
  <!-- pivots -->
  <circle cx="140" cy="254" r="7" fill="#1a202c"/>
  <circle cx="290" cy="254" r="7" fill="#1a202c"/>

  <!-- ball -->
  <circle cx="215" cy="152" r="27" fill="#f5c518" stroke="#c99a00" stroke-width="2"/>
  <text x="215" y="157" text-anchor="middle" font-size="11" font-weight="600" fill="#6b5200">ball</text>

  <!-- 5 command: closing arrows -->
  <path d="M104,178 Q120,160 146,160" fill="none" stroke="#c05621" stroke-width="3" marker-end="url(#arrow-cmd)"/>
  <path d="M326,178 Q310,160 284,160" fill="none" stroke="#c05621" stroke-width="3" marker-end="url(#arrow-cmd)"/>
  <text x="215" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">close()</text>

  <!-- controller -->
  <path d="M215,462 L215,446" stroke="#2b6cb0" stroke-width="3" marker-end="url(#arrow-bind)"/>
  <rect x="128" y="470" width="174" height="84" rx="38" fill="#2f3a46"/>
  <circle cx="168" cy="505" r="13" fill="#4a5568"/>
  <circle cx="200" cy="530" r="10" fill="#4a5568"/>
  <circle cx="262" cy="486" r="9" fill="#d69e2e"/><text x="262" y="490" text-anchor="middle" font-size="10" font-weight="700" fill="#1a202c">Y</text>
  <circle cx="244" cy="504" r="9" fill="#3182ce"/><text x="244" y="508" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">X</text>
  <circle cx="280" cy="504" r="9" fill="#e53e3e"/><text x="280" y="508" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">B</text>
  <circle cx="262" cy="522" r="10" fill="#38a169" stroke="#ffffff" stroke-width="2.5"/><text x="262" y="526" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">A</text>
  <text x="215" y="578" text-anchor="middle" font-size="13" fill="#5a6475">Xbox controller: press A</text>

  <!-- badges on the robot -->
  <g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="46" cy="82" r="14" fill="#6b46c1"/><text x="46" y="87">4</text>
    <circle cx="190" cy="384" r="14" fill="#2d3748"/><text x="190" y="389">1</text>
    <circle cx="186" cy="262" r="14" fill="#b7791f"/><text x="186" y="267">2</text>
    <circle cx="120" cy="228" r="14" fill="#2f855a"/><text x="120" y="233">3</text>
    <circle cx="350" cy="200" r="14" fill="#c05621"/><text x="350" y="205">5</text>
    <circle cx="318" cy="472" r="14" fill="#2b6cb0"/><text x="318" y="477">6</text>
  </g>

  <!-- divider -->
  <line x1="440" y1="40" x2="440" y2="580" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ============ RIGHT: the code layers ============ -->
  <text x="715" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">The code that runs it</text>
  <text x="715" y="66" text-anchor="middle" font-size="13" fill="#5a6475">each layer uses the one below it</text>

  <!-- layer template: y, color, number, title, subtitle, code, pill -->
  <!-- 6 Binding -->
  <g>
    <rect x="466" y="82" width="470" height="74" rx="10" fill="#f7fafc" stroke="#cbd5e0"/>
    <rect x="466" y="82" width="10" height="74" rx="4" fill="#2b6cb0"/>
    <circle cx="500" cy="119" r="14" fill="#2b6cb0"/><text x="500" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">6</text>
    <text x="524" y="108" font-size="16" font-weight="700" fill="#1a202c">Binding</text>
    <text x="602" y="108" font-size="13" fill="#5a6475">a button starts a command</text>
    <text x="524" y="138" font-size="13" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#2d3748">whileTrue(m_driver::a, m_gripper.close())</text>
    <rect x="852" y="94" width="72" height="22" rx="11" fill="none" stroke="#2b6cb0" stroke-width="1.5"/><text x="888" y="109" text-anchor="middle" font-size="11" font-weight="600" fill="#2b6cb0">from lib</text>
  </g>
  <!-- 5 Command -->
  <g>
    <rect x="466" y="164" width="470" height="74" rx="10" fill="#f7fafc" stroke="#cbd5e0"/>
    <rect x="466" y="164" width="10" height="74" rx="4" fill="#c05621"/>
    <circle cx="500" cy="201" r="14" fill="#c05621"/><text x="500" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text>
    <text x="524" y="190" font-size="16" font-weight="700" fill="#1a202c">Command</text>
    <text x="616" y="190" font-size="13" fill="#5a6475">something the gripper does</text>
    <text x="524" y="220" font-size="13" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#2d3748">close()   open()   grabAndRelease()</text>
    <rect x="852" y="176" width="72" height="22" rx="11" fill="#c05621"/><text x="888" y="191" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">you write</text>
  </g>
  <!-- 4 Subsystem -->
  <g>
    <rect x="466" y="246" width="470" height="74" rx="10" fill="#f7fafc" stroke="#cbd5e0"/>
    <rect x="466" y="246" width="10" height="74" rx="4" fill="#6b46c1"/>
    <circle cx="500" cy="283" r="14" fill="#6b46c1"/><text x="500" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
    <text x="524" y="272" font-size="16" font-weight="700" fill="#1a202c">Subsystem</text>
    <text x="622" y="272" font-size="13" fill="#5a6475">owns both jaws and their angles</text>
    <text x="524" y="302" font-size="13" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#2d3748">class Gripper extends SubsystemBase</text>
    <rect x="852" y="258" width="72" height="22" rx="11" fill="#6b46c1"/><text x="888" y="273" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">you write</text>
  </g>
  <!-- 3 Servo -->
  <g>
    <rect x="466" y="328" width="470" height="74" rx="10" fill="#f7fafc" stroke="#cbd5e0"/>
    <rect x="466" y="328" width="10" height="74" rx="4" fill="#2f855a"/>
    <circle cx="500" cy="365" r="14" fill="#2f855a"/><text x="500" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
    <text x="524" y="354" font-size="16" font-weight="700" fill="#1a202c">Servo ×2</text>
    <text x="608" y="354" font-size="13" fill="#5a6475">one jaw to an angle, smoothly</text>
    <text x="524" y="384" font-size="13" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#2d3748">OutboardAngularPositionServo</text>
    <!-- little trapezoid profile icon -->
    <path d="M770,388 L784,372 L808,372 L822,388" fill="none" stroke="#2f855a" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="852" y="340" width="72" height="22" rx="11" fill="none" stroke="#2f855a" stroke-width="1.5"/><text x="888" y="355" text-anchor="middle" font-size="11" font-weight="600" fill="#2f855a">from lib</text>
  </g>
  <!-- 2 Mechanism -->
  <g>
    <rect x="466" y="410" width="470" height="74" rx="10" fill="#f7fafc" stroke="#cbd5e0"/>
    <rect x="466" y="410" width="10" height="74" rx="4" fill="#b7791f"/>
    <circle cx="500" cy="447" r="14" fill="#b7791f"/><text x="500" y="452" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
    <text x="524" y="436" font-size="16" font-weight="700" fill="#1a202c">Mechanism ×2</text>
    <text x="650" y="436" font-size="13" fill="#5a6475">motor + gears + limits</text>
    <text x="524" y="466" font-size="13" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#2d3748">RotaryMechanism</text>
    <rect x="852" y="422" width="72" height="22" rx="11" fill="none" stroke="#b7791f" stroke-width="1.5"/><text x="888" y="437" text-anchor="middle" font-size="11" font-weight="600" fill="#b7791f">from lib</text>
  </g>
  <!-- 1 Motor -->
  <g>
    <rect x="466" y="492" width="470" height="74" rx="10" fill="#f7fafc" stroke="#cbd5e0"/>
    <rect x="466" y="492" width="10" height="74" rx="4" fill="#2d3748"/>
    <circle cx="500" cy="529" r="14" fill="#2d3748"/><text x="500" y="534" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
    <text x="524" y="518" font-size="16" font-weight="700" fill="#1a202c">Motor ×2</text>
    <text x="606" y="518" font-size="13" fill="#5a6475">a Kraken or a SPARK</text>
    <text x="524" y="548" font-size="13" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#2d3748">KrakenX44Motor  /  NeoCANSparkMotor</text>
    <rect x="852" y="504" width="72" height="22" rx="11" fill="none" stroke="#2d3748" stroke-width="1.5"/><text x="888" y="519" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3748">from lib</text>
  </g>

  <!-- "uses" arrow down the right edge -->
  <line x1="962" y1="96" x2="962" y2="548" stroke="#8a94a3" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="980" y="322" text-anchor="middle" font-size="12" fill="#5a6475" transform="rotate(90 980 322)">uses</text>
</svg>
