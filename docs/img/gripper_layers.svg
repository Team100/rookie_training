<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>What happens when you press A</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker>
  </defs>
  <rect width="1000" height="800" rx="18" fill="#fff"/>

  <text x="40" y="48" font-size="22" font-weight="700" fill="#1a202c">What happens when you press A</text>
  <text x="40" y="72" font-size="13.5" fill="#5a6475">Every 20 ms, from the button down to the jaws</text>

  <!-- left rail: layer names -->
  <g font-size="12" font-weight="700" fill="#8a94a3" letter-spacing="1.5">
    <text x="40" y="133">BUTTON</text>
    <text x="40" y="213">BINDING</text>
    <text x="40" y="293">COMMAND</text>
    <text x="40" y="373">SUBSYSTEM</text>
    <text x="40" y="453">SERVO</text>
    <text x="40" y="533">MECHANISM</text>
    <text x="40" y="613">MOTOR</text>
  </g>

  <!-- button -->
  <rect x="440" y="100" width="120" height="54" rx="27" fill="#2f3a46"/>
  <circle cx="530" cy="127" r="12" fill="#38a169" stroke="#fff" stroke-width="2.5"/><text x="530" y="131" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">A</text>
  <circle cx="468" cy="127" r="10" fill="#4a5568"/>
  <line x1="500" y1="156" x2="500" y2="180" stroke="#4a5568" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- binding -->
  <rect x="330" y="186" width="340" height="44" rx="10" fill="#fff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="500" y="214" text-anchor="middle" font-size="13" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#2b6cb0">whileTrue(m_driver::a, close())</text>
  <line x1="500" y1="232" x2="500" y2="260" stroke="#4a5568" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- command -->
  <rect x="380" y="266" width="240" height="44" rx="10" fill="#c05621"/>
  <text x="500" y="294" text-anchor="middle" font-size="14" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" fill="#fff">close()</text>
  <line x1="500" y1="312" x2="500" y2="340" stroke="#4a5568" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- subsystem -->
  <rect x="330" y="346" width="340" height="44" rx="10" fill="#6b46c1"/>
  <text x="500" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Gripper  (CLOSED = 1.2 rad)</text>

  <!-- split -->
  <path d="M500,392 L500,404 L290,404 L290,420" fill="none" stroke="#4a5568" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M500,404 L710,404 L710,420" fill="none" stroke="#4a5568" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- left column -->
  <rect x="170" y="426" width="240" height="44" rx="10" fill="#fff" stroke="#2f855a" stroke-width="2"/>
  <text x="290" y="447" text-anchor="middle" font-size="13" font-weight="700" fill="#2f855a">left servo</text>
  <text x="290" y="463" text-anchor="middle" font-size="11" fill="#2d3748">smooth path to 1.2 rad</text>
  <line x1="290" y1="472" x2="290" y2="500" stroke="#4a5568" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="170" y="506" width="240" height="44" rx="10" fill="#fff" stroke="#b7791f" stroke-width="2"/>
  <text x="290" y="527" text-anchor="middle" font-size="13" font-weight="700" fill="#b7791f">left mechanism</text>
  <text x="290" y="543" text-anchor="middle" font-size="11" fill="#2d3748">jaw angle → motor angle (× gears)</text>
  <line x1="290" y1="552" x2="290" y2="580" stroke="#4a5568" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="170" y="586" width="240" height="44" rx="10" fill="#fff" stroke="#2d3748" stroke-width="2"/>
  <text x="290" y="607" text-anchor="middle" font-size="13" font-weight="700" fill="#2d3748">left motor</text>
  <text x="290" y="623" text-anchor="middle" font-size="11" fill="#2d3748">FORWARD</text>

  <!-- right column -->
  <rect x="590" y="426" width="240" height="44" rx="10" fill="#fff" stroke="#2f855a" stroke-width="2"/>
  <text x="710" y="447" text-anchor="middle" font-size="13" font-weight="700" fill="#2f855a">right servo</text>
  <text x="710" y="463" text-anchor="middle" font-size="11" fill="#2d3748">smooth path to 1.2 rad</text>
  <line x1="710" y1="472" x2="710" y2="500" stroke="#4a5568" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="590" y="506" width="240" height="44" rx="10" fill="#fff" stroke="#b7791f" stroke-width="2"/>
  <text x="710" y="527" text-anchor="middle" font-size="13" font-weight="700" fill="#b7791f">right mechanism</text>
  <text x="710" y="543" text-anchor="middle" font-size="11" fill="#2d3748">jaw angle → motor angle (× gears)</text>
  <line x1="710" y1="552" x2="710" y2="580" stroke="#4a5568" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="590" y="586" width="240" height="44" rx="10" fill="#fff" stroke="#2d3748" stroke-width="2"/>
  <text x="710" y="607" text-anchor="middle" font-size="13" font-weight="700" fill="#2d3748">right motor</text>
  <text x="710" y="623" text-anchor="middle" font-size="11" fill="#2d3748">REVERSE (it faces the other way)</text>

  <!-- the real thing -->
  <line x1="290" y1="632" x2="290" y2="660" stroke="#4a5568" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="710" y1="632" x2="710" y2="660" stroke="#4a5568" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="170" y="666" width="660" height="114" rx="14" fill="#eef1f5" stroke="#a7b0bd" stroke-width="2"/>
  <text x="500" y="772" text-anchor="middle" font-size="11" fill="#5a6475">seen from above</text>
  <!-- open ghosts -->
  <path d="M290,752 C268,722 236,704 200,698" fill="none" stroke="#2f855a" stroke-opacity="0.22" stroke-width="14" stroke-linecap="round"/>
  <path d="M710,752 C732,722 764,704 800,698" fill="none" stroke="#2f855a" stroke-opacity="0.22" stroke-width="14" stroke-linecap="round"/>
  <text x="214" y="726" font-size="11" fill="#5a6475">OPEN</text>
  <text x="786" y="726" text-anchor="end" font-size="11" fill="#5a6475">OPEN</text>
  <!-- closed jaws, on the ball -->
  <path d="M290,752 C340,712 420,700 470,712" fill="none" stroke="#2f855a" stroke-width="14" stroke-linecap="round"/>
  <path d="M710,752 C660,712 580,700 530,712" fill="none" stroke="#2f855a" stroke-width="14" stroke-linecap="round"/>
  <circle cx="500" cy="718" r="27" fill="#f5c518" stroke="#c99a00" stroke-width="2"/>
  <text x="500" y="723" text-anchor="middle" font-size="11" font-weight="600" fill="#6b5200">ball</text>
  <!-- gearboxes at the pivots -->
  <rect x="268" y="740" width="44" height="28" rx="5" fill="#b7791f"/>
  <rect x="688" y="740" width="44" height="28" rx="5" fill="#b7791f"/>
  <circle cx="290" cy="752" r="6" fill="#1a202c"/><circle cx="710" cy="752" r="6" fill="#1a202c"/>
  <!-- closing arrows -->
  <path d="M372,684 Q404,676 430,684" fill="none" stroke="#c05621" stroke-width="2.5" marker-end="url(#c)"/>
  <path d="M628,684 Q596,676 570,684" fill="none" stroke="#c05621" stroke-width="2.5" marker-end="url(#c)"/>
  <text x="40" y="728" font-size="12" font-weight="700" fill="#8a94a3" letter-spacing="1.5">THE JAWS</text>

  <!-- which ones you write: bracket on the right -->
  <path d="M852,268 L866,268 L866,388 L852,388" fill="none" stroke="#4a5568" stroke-width="2"/>
  <text x="876" y="324" font-size="12.5" font-weight="700" fill="#4a5568">you write</text>
  <text x="876" y="341" font-size="12.5" font-weight="700" fill="#4a5568">these two</text>
  <path d="M852,186 L866,186 L866,230 L852,230" fill="none" stroke="#a0aec0" stroke-width="2"/>
  <text x="876" y="213" font-size="12" fill="#5a6475">from lib</text>
  <path d="M852,426 L866,426 L866,630 L852,630" fill="none" stroke="#a0aec0" stroke-width="2"/>
  <text x="876" y="532" font-size="12" fill="#5a6475">from lib</text>
</svg>
